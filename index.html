<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FitClub Tax Day Promo Banner</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Montserrat', sans-serif;
    }

    .banner-container {
      position: relative;
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .banner-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://www.fitclub.net/sites/ob-143.app.sitewright.io/files/image/2024-09/west%20weights2%20%281%29.JPG');
      background-size: cover;
      background-position: center;
      filter: brightness(0.6);
      z-index: 0;
    }

    .dollar-rain {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .dollar {
      position: absolute;
      top: -10%;
      font-size: 1.5em;
      color: #00ff66;
      opacity: 0.8;
      user-select: none;
      animation-name: rain;
      animation-iteration-count: infinite;
      animation-timing-function: linear;
    }

    @keyframes rain {
      0%   { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(110vh) rotate(360deg); }
    }

    .banner-content {
      position: relative;
      z-index: 2;
      padding: 20px;
      max-width: 800px;
      width: 100%;
    }

    .main-message {
      font-size: 3em;
      margin-bottom: 0.5em;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.7);
      padding: 0 20px;
      word-wrap: break-word;
    }

    .highlights {
      font-size: 1.5em;
      margin-bottom: 1em;
      line-height: 1.4;
      padding: 0 20px;
    }

    .highlights div {
      margin-bottom: 0.5em;
    }

    .cta-button {
      display: inline-block;
      padding: 15px 30px;
      background-color: #00cc66;
      color: #fff;
      text-transform: uppercase;
      font-size: 1.2em;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: default;
      text-decoration: none;
      box-shadow: 0 0 10px rgba(0, 255, 100, 0.5);
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .main-message { font-size: 2em; }
      .highlights { font-size: 1.2em; }
      .cta-button {
        font-size: 1em;
        padding: 12px 25px;
      }
    }

    @media (max-width: 480px) {
      .main-message { font-size: 1.5em; }
      .highlights { font-size: 1em; }
      .cta-button {
        font-size: 0.9em;
        padding: 10px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="banner-container">
    <div class="banner-background"></div>
    <div class="dollar-rain" aria-hidden="true"></div>

    <div class="banner-content">
      <div class="main-message">Tax Season is the Perfect Time to Deduct Excuses</div>
      <div class="highlights">
        <div>💰 Join FitClub for just <strong>$10.40 EZ</strong></div>
        <div>🧾 Claim your refund — then claim your gains</div>
        <div>💪 Invest in health before the IRS invests it for you</div>
        <div>📅 Deadline: <strong>April 15, 2025</strong></div>
      </div>
      <div class="cta-button">Start Now for $10.40 — Limited Time!</div>
    </div>
  </div>

  <!-- JavaScript to Generate Dollar Rain -->
  <script>
    const rainContainer = document.querySelector('.dollar-rain');
    const dropCount = 40;

    for (let i = 0; i < dropCount; i++) {
      const drop = document.createElement('div');
      drop.classList.add('dollar');
      drop.textContent = '$';

      const size = Math.random() * 1.5 + 0.5;
      drop.style.fontSize = size + 'em';

      drop.style.left = Math.random() * 100 + '%';

      const duration = Math.random() * 10 + 5;
      drop.style.animationDuration = duration + 's';

      drop.style.animationDelay = Math.random() * 10 + 's';

      drop.style.opacity = Math.random() * 0.5 + 0.5;

      rainContainer.appendChild(drop);
    }
  </script>
</body>
</html>
